plugins { id 'com.android.application' }

android {
    namespace 'cd.jesuiskcciste.formation'
    compileSdk 36

    defaultConfig {
        applicationId "cd.jesuiskcciste.formation"
        minSdk 21
        targetSdk 36
        versionCode 4        // augmentez de 1 à chaque envoi sur Google Play
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
