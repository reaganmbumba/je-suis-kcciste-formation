name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Construire l'APK
        run: gradle assembleDebug --no-daemon
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk KCCiste-Formation.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KCCiste-Formation-APK
          path: KCCiste-Formation.apk
