name: Construire l'application

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: APK de test
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: APK-test-telephone
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Verifier les secrets
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Secrets manquants - ajoutez-les pour obtenir le fichier AAB"
      - name: Preparer la cle
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Fichier AAB Google Play
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: FICHIER-AAB-GOOGLE-PLAY
          path: app/build/outputs/bundle/release/app-release.aab
