name: Publier la version web (iPhone)

# Publie app/src/main/assets/index.html (la même application que l'APK) sur GitHub Pages,
# avec le manifeste, les icônes et le mode hors ligne du dossier web/.
on:
  push:
    branches: [main]
    paths:
      - app/src/main/assets/**
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp app/src/main/assets/index.html _site/index.html
          # nouvelle version du cache hors ligne à chaque publication
          sed -i "s/kcciste-v1/kcciste-${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
