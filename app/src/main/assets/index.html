<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071A3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KCCiste Formation">
<meta name="description" content="Formation doctrinale pour les néophytes – Église Bon Nouveau Message (KCC)">
<title>JE SUIS KCCiste – FORMATION</title>
<link id="favicon" rel="icon" href="">

<!--
  =====================================================================
  JE SUIS KCCiste – FORMATION
  Application de formation doctrinale (version 1 – 100 % locale)
  ---------------------------------------------------------------------
  Fichier unique : HTML + CSS + JavaScript. Aucune bibliothèque externe,
  aucune police distante, aucun serveur : fonctionne hors ligne.

  OÙ MODIFIER (rechercher ces repères dans le fichier) :
    [CONFIG]      Nom du créateur, paroisse, numéro WhatsApp, messages
    [COULEURS]    Variables CSS des couleurs (:root)
    [LOGO]        Fonction logoSVG()  (logo vectoriel « FORMATION »)
    [CHAPITRES]   Tableau CHAPTERS (cours + questions)
    [DATES]       Tableau DATES (chronologie)
    [AUTH]        AuthService (à remplacer plus tard par un vrai backend)
  =====================================================================
-->

<style>
/* ============================================================
   [COULEURS] Identité visuelle
   ============================================================ */
:root{
  --night:#071A3D;        /* Bleu nuit  */
  --royal:#0B3D91;        /* Bleu royal */
  --gold:#D4AF37;         /* Or         */
  --gold-light:#F5D76E;   /* Or clair   */
  --white:#FFFFFF;

  --bg:#F2F4F9;
  --surface:#FFFFFF;
  --text:#0D1A33;
  --muted:#56627C;
  --line:#E1E6F0;
  --soft:#EEF2FA;

  --ok:#177A4D;  --ok-bg:#E6F5EC;
  --err:#B3261E; --err-bg:#FCEBEA;
  --pend-bg:#FFF8E1; --pend-text:#6A5100;

  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 3px rgba(7,26,61,.06), 0 4px 14px rgba(7,26,61,.06);
  --shadow-lg:0 12px 32px rgba(7,26,61,.16);
  --grad:linear-gradient(145deg,var(--royal) 0%,var(--night) 78%);
  --grad-gold:linear-gradient(90deg,var(--gold) 0%,var(--gold-light) 100%);

  --nav-h:66px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);

  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-padding-top:calc(64px + var(--safe-t))}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;min-height:100vh;
}
a{color:var(--royal)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
p{margin:.5em 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Animations discrètes ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:scale(1)}}
.fade{animation:fadeUp .28s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:50px;padding:.7em 1.3em;border-radius:14px;border:0;cursor:pointer;
  font-weight:700;font-size:1rem;text-decoration:none;letter-spacing:.01em;
  transition:transform .12s ease, box-shadow .2s ease, background .2s;
}
.btn:active{transform:scale(.98)}
.btn-block{display:flex;width:100%}
.btn-gold{background:var(--grad-gold);color:var(--night);box-shadow:0 4px 14px rgba(212,175,55,.35)}
.btn-royal{background:var(--royal);color:#fff}
.btn-royal:hover{background:#0a3480}
.btn-ghost{background:transparent;color:var(--royal);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--royal)}
.btn-wa{background:transparent;color:#fff;border:1.5px solid rgba(245,215,110,.7)}
.btn-whatsapp{background:#1FAF55;color:#fff}
.btn-fb{background:#1877F2;color:#fff}
.btn-wa:hover{background:rgba(245,215,110,.1)}
.btn-danger{background:transparent;color:var(--err);border:1.5px solid #f0c9c6}
.btn-sm{min-height:40px;padding:.45em .95em;font-size:.9rem;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
@media(min-width:560px){.btn-row.inline{flex-direction:row;flex-wrap:wrap}.btn-row.inline .btn{flex:1}}

/* ============================================================
   Écrans plein écran (accès, membre, bienvenue)
   ============================================================ */
.fullscreen{
  min-height:100vh;min-height:100dvh;background:var(--grad);color:#fff;
  padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
  display:flex;justify-content:center;
}
.fs-inner{width:100%;max-width:440px;display:flex;flex-direction:column}
.brand{display:flex;justify-content:center;margin:8px 0 18px}
.fs-title{font-size:1.75rem;text-align:center;font-weight:700;letter-spacing:.01em}
.fs-title span{display:block;font-family:var(--sans);font-size:.8rem;letter-spacing:.34em;color:var(--gold-light);margin-top:6px;font-weight:700}
.fs-sub{text-align:center;color:#C9D4EC;margin:12px 0 0;font-size:.95rem}
.fs-intro{text-align:center;color:#E6ECF8;font-family:var(--serif);font-style:italic;font-size:1.02rem;margin:18px 4px 22px;line-height:1.6}
.glass{
  background:rgba(255,255,255,.06);border:1px solid rgba(245,215,110,.28);
  border-radius:var(--radius);padding:22px 20px;backdrop-filter:blur(6px);
}
.glass h2{font-family:var(--sans);font-size:1rem;letter-spacing:.08em;color:var(--gold-light);margin-bottom:8px}
.glass p{color:#DCE4F4;font-size:.95rem}
.glass .small{color:#AFBEDD}
.fs-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:.76rem;color:#8FA2C9;line-height:1.6}
.fs-foot a{color:#B8C6E3}
.field{display:block;margin:14px 0}
.field span{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.input{
  width:100%;min-height:52px;padding:.75em .95em;font-size:16px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;color:var(--text);font-family:inherit;
}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.25)}
.glass .input{border-color:rgba(255,255,255,.2)}
.form-error{background:var(--err-bg);color:var(--err);border-radius:10px;padding:.6em .8em;font-size:.9rem;margin-top:10px}
.back-link{align-self:flex-start;color:#C9D4EC;text-decoration:none;font-size:.95rem;padding:8px 0;margin-bottom:6px}

/* ============================================================
   Coquille de l'application
   ============================================================ */
.layout{min-height:100vh}
.sidebar{display:none}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--night);color:#fff;
  padding:calc(8px + var(--safe-t)) 12px 8px;display:flex;align-items:center;gap:10px;min-height:58px;
  box-shadow:0 1px 0 rgba(212,175,55,.35);
}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0}
.tb-brand b{font-family:var(--serif);font-size:1.02rem;font-weight:700;white-space:nowrap}
.tb-brand small{display:block;font-size:.66rem;letter-spacing:.24em;color:var(--gold-light);font-weight:700}
.tb-title{flex:1;min-width:0;font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:pointer;text-decoration:none;flex-shrink:0;
}
.icon-btn:hover{background:rgba(255,255,255,.15)}
.spacer{flex:1}

.view{max-width:780px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + var(--safe-b) + 28px)}

.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  padding:0 4px var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + var(--safe-b));
  box-shadow:0 -4px 16px rgba(7,26,61,.06);
}
.bn-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;
  color:var(--muted);font-size:.72rem;font-weight:600;position:relative;
}
.bn-item .ico{font-size:1.25rem;line-height:1;filter:grayscale(.6);opacity:.75}
.bn-item[aria-current="page"]{color:var(--royal)}
.bn-item[aria-current="page"] .ico{filter:none;opacity:1}
.bn-item[aria-current="page"]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

/* Écrans larges : menu latéral */
@media(min-width:960px){
  .layout{display:grid;grid-template-columns:268px 1fr}
  .sidebar{
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;
    background:var(--night);color:#fff;padding:22px 14px;
  }
  .sb-brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;text-decoration:none;color:#fff}
  .sb-brand b{font-family:var(--serif);font-size:1.1rem}
  .sb-brand small{display:block;font-size:.68rem;letter-spacing:.26em;color:var(--gold-light);font-weight:700}
  .sb-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:#C9D4EC;text-decoration:none;font-size:.95rem}
  .sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
  .sb-link[aria-current="page"]{background:rgba(212,175,55,.14);color:var(--gold-light)}
  .sb-foot{margin-top:auto;padding:14px 10px 0;font-size:.74rem;color:#7F93BD;line-height:1.55}
  .bottomnav{display:none}
  .topbar .tb-brand{display:none}
  .view{padding:28px 32px 48px}
}

/* ============================================================
   Composants
   ============================================================ */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid rgba(225,230,240,.7)}
.card-dark{background:var(--grad);color:#fff;border:0}
.card-dark .muted{color:#BFCBE6}
.eyebrow{font-size:.78rem;font-weight:700;color:var(--royal);letter-spacing:.06em;margin-bottom:6px}
.card-dark .eyebrow{color:var(--gold-light)}
.page-head{margin:4px 0 18px}
.page-head h1{font-size:1.6rem;color:var(--night)}
.page-head p{color:var(--muted);margin-top:6px}

.bar{height:10px;border-radius:99px;background:#E4E9F3;overflow:hidden}
.card-dark .bar{background:rgba(255,255,255,.14)}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--grad-gold);transition:width .6s ease}
.bar.sm{height:6px}

.hello{margin:2px 0 16px}
.hello .hi{color:var(--muted);font-size:.95rem}
.hello h1{font-size:1.55rem;color:var(--night);margin-top:2px}
.hello p{color:var(--muted);margin-top:4px;font-size:.93rem}

.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog-top .big{font-family:var(--serif);font-size:2.2rem;font-weight:700;color:var(--gold-light);line-height:1}
.prog-stats{display:flex;gap:18px;margin-top:12px;font-size:.9rem;flex-wrap:wrap}
.prog-stats b{color:#fff}

.continue{display:flex;gap:14px;align-items:center}
.continue .num{
  width:52px;height:52px;border-radius:14px;background:var(--soft);color:var(--royal);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:1.3rem;
}
.continue .txt{flex:1;min-width:0}
.continue .txt b{display:block;color:var(--night);line-height:1.3}

.searchbar{
  display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border-radius:14px;
  background:#fff;border:1.5px solid var(--line);color:var(--muted);text-decoration:none;margin-bottom:16px;font-size:.98rem;
}
.searchbar:hover{border-color:var(--gold)}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{
  background:#fff;border-radius:var(--radius);padding:16px 14px;text-decoration:none;color:var(--text);
  border:1px solid rgba(225,230,240,.8);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;
  transition:transform .15s ease, box-shadow .2s ease;min-height:120px;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.tile b{font-size:.95rem;color:var(--night)}
.tile span{font-size:.83rem;color:var(--muted);line-height:1.4}

.section-title{font-family:var(--sans);font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:22px 0 10px}

/* Liste des chapitres */
.ch-list{display:flex;flex-direction:column;gap:10px}
.ch-item{
  display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px;
  border:1px solid rgba(225,230,240,.9);box-shadow:var(--shadow);text-decoration:none;color:var(--text);
}
.ch-item .n{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:1.1rem;background:var(--soft);color:var(--royal);
}
.ch-item.done .n{background:var(--ok-bg);color:var(--ok)}
.ch-item.locked{opacity:.62}
.ch-item.locked .n{background:#EEF0F4;color:#8A93A6}
.ch-item .t{flex:1;min-width:0}
.ch-item .t b{display:block;font-size:.97rem;color:var(--night);line-height:1.3}
.ch-item .t small{color:var(--muted);font-size:.8rem}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:700;white-space:nowrap}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-go{background:#FFF4D2;color:#7A5B00}
.pill-lock{background:#EEF0F4;color:#6B7486}

/* Chapitre */
.ch-hero{background:var(--grad);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;position:relative}
.ch-hero .eyebrow{color:var(--gold-light)}
.ch-hero h1{font-size:1.5rem;padding-right:52px}
.ch-hero .fav{position:absolute;top:14px;right:14px}
.fav-btn{
  width:44px;height:44px;border-radius:12px;border:0;cursor:pointer;background:rgba(255,255,255,.1);
  font-size:1.2rem;display:inline-flex;align-items:center;justify-content:center;color:var(--gold-light);
}
.fav-btn[aria-pressed="true"]{background:rgba(212,175,55,.25)}
.sec{background:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid rgba(225,230,240,.8);box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.86rem;letter-spacing:.07em;color:var(--royal);margin-bottom:10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.lesson{font-family:var(--serif);font-size:1.06rem;line-height:1.7}
.doc-list{padding-left:0;list-style:none;counter-reset:d;margin:10px 0}
.doc-list li{counter-increment:d;position:relative;padding:10px 0 10px 44px;border-bottom:1px dashed var(--line)}
.doc-list li:last-child{border-bottom:0}
.doc-list li::before{
  content:counter(d);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:9px;
  background:var(--night);color:var(--gold-light);font-family:var(--sans);font-weight:700;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;
}
.keypoints{list-style:none;padding:0;margin:0}
.keypoints li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--soft)}
.keypoints li:last-child{border-bottom:0}
.keypoints .chk{color:var(--gold);font-weight:900;margin-top:1px}
.keypoints .kp-t{flex:1}
.star-sm{border:0;background:none;cursor:pointer;font-size:1.05rem;padding:4px 6px;min-width:36px;min-height:36px;border-radius:8px;color:#B5BCCB}
.star-sm[aria-pressed="true"]{color:var(--gold)}
.terms{display:grid;gap:10px}
.term{background:var(--soft);border-radius:12px;padding:12px 14px}
.term b{color:var(--night);display:block;margin-bottom:2px}
.term span{font-size:.93rem;color:#34405A}
.pending{
  background:var(--pend-bg);color:var(--pend-text);border:1.5px dashed #E3C66A;border-radius:12px;
  padding:10px 12px;font-family:var(--sans);font-size:.9rem;margin:10px 0;line-height:1.45;
}
.source{font-size:.86rem;color:var(--muted)}
.prayer{background:linear-gradient(180deg,#F7F9FE,#fff);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 16px;margin:12px 0;font-family:var(--serif);font-size:1.05rem;line-height:1.75}
.pr-mark{font-family:var(--sans);font-size:.74rem;font-weight:800;letter-spacing:.08em;color:var(--royal);margin:8px 0 2px}
.sub-h{font-family:var(--sans);font-size:.9rem;font-weight:800;color:var(--night);margin:16px 0 4px}
.kcc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kcc{background:var(--night);color:#fff;border-radius:14px;padding:12px 8px;text-align:center;font-family:var(--sans)}
.kcc span{display:block;font-family:var(--serif);font-size:1.8rem;color:var(--gold-light);font-weight:700;line-height:1.1}
.kcc b{display:block;font-size:.95rem;margin-top:4px}
.kcc small{display:block;color:#C9D4EC;font-size:.74rem;line-height:1.35;margin-top:4px}
.test-cta{border:1.5px solid rgba(212,175,55,.5);background:linear-gradient(180deg,#FFFDF5,#fff)}
.ch-nav{display:flex;gap:10px;margin-top:6px}
.ch-nav .btn{flex:1}

/* QCM */
.q-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.q-tag{display:inline-block;margin:14px 0 0;font-size:.76rem;font-weight:700;color:var(--royal);background:var(--soft);border-radius:99px;padding:3px 10px}
.q-text{font-size:1.2rem;color:var(--night);margin:12px 0 16px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:54px;padding:10px 14px;cursor:pointer;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;font-size:.98rem;line-height:1.4;transition:border-color .15s, background .15s;
}
.opt:hover:not([disabled]){border-color:var(--royal)}
.opt .l{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--royal);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt.wrong .l{background:var(--err);color:#fff}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:700}
.match-row{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--soft)}
.match-row b{color:var(--night);font-size:.95rem}
.match-row select{min-height:48px}
.match-row.ok select{border-color:var(--ok);background:var(--ok-bg)}
.match-row.ko select{border-color:var(--err);background:var(--err-bg)}
.feedback{border-radius:14px;padding:14px;margin-top:16px;animation:pop .25s ease}
.feedback.ok{background:var(--ok-bg);border:1px solid #BFE3CE}
.feedback.ko{background:var(--err-bg);border:1px solid #F1C7C3}
.fb-title{font-weight:800;font-size:1.02rem}
.feedback.ok .fb-title{color:var(--ok)}
.feedback.ko .fb-title{color:var(--err)}
.fb-ans{font-size:.93rem;margin-top:4px}
.feedback p{font-size:.92rem;color:#3A4560}
.result{text-align:center;padding:10px 0}
.result .score{font-family:var(--serif);font-size:3rem;font-weight:700;color:var(--night);line-height:1}
.result .pct{color:var(--royal);font-weight:800;margin-top:6px}
.result .msg{font-family:var(--serif);font-size:1.15rem;margin:10px 0 4px;color:var(--night)}

/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border-radius:16px;padding:14px;border:1px solid rgba(225,230,240,.9);box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-size:.8rem;font-weight:600;display:block}
.stat b{font-family:var(--serif);font-size:1.55rem;color:var(--night);display:block;margin-top:2px}

/* Chronologie */
.timeline{position:relative;margin:6px 0 0 6px;padding-left:24px;border-left:2px solid rgba(212,175,55,.6)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-32px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
.tl-date{font-weight:800;color:var(--royal);font-size:.88rem;letter-spacing:.03em}
.tl-title{font-family:var(--serif);font-size:1.05rem;color:var(--night);margin-top:2px}

/* Recherche */
.results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.res{display:block;background:#fff;border-radius:14px;padding:14px;text-decoration:none;color:var(--text);border:1px solid var(--line)}
.res:hover{border-color:var(--royal)}
.res b{color:var(--night)}
.res p{font-size:.9rem;color:var(--muted);margin:4px 0 0}
mark{background:rgba(245,215,110,.6);color:inherit;border-radius:3px;padding:0 2px}

/* Menu */
.menu-list{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.menu-list a{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:54px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--soft)}
.menu-list a:last-child{border-bottom:0}
.menu-list a:hover{background:var(--soft)}
.menu-list .mi{width:28px;text-align:center;font-size:1.15rem}
.menu-list .chev{margin-left:auto;color:#A5AEC0}
.profile{display:flex;align-items:center;gap:14px}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--grad-gold);color:var(--night);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;flex-shrink:0}

.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .e-ic{font-size:2.2rem}

/* Pied de page discret */
.app-footer{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:.76rem;color:#7C87A0;line-height:1.7}
.app-footer .fb{font-family:var(--serif);font-weight:700;color:var(--muted);font-size:.84rem}
.app-footer a{color:#6A7690}

/* Toasts (micro-interactions) */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media(min-width:960px){#toasts{bottom:24px}}
.toast{background:var(--night);color:#fff;padding:10px 18px;border-radius:99px;font-size:.92rem;font-weight:600;box-shadow:var(--shadow-lg);animation:fadeUp .25s ease;border:1px solid rgba(212,175,55,.4);max-width:100%}

.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(7,26,61,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--radius);padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow-lg);animation:pop .2s ease}
.modal p{margin:0 0 6px;font-size:1rem}
.final-hero{text-align:center;padding:28px 18px}
.final-hero .medal{font-size:3rem}
.final-hero h1{font-size:1.7rem;margin-top:6px}
.contact-num{font-size:.9rem;color:var(--muted)}
/* ============================================================
   Certificat de fin de formation (écran + impression A4 paysage)
   ============================================================ */
.cert-wrap{width:100%;overflow:hidden;margin:6px 0 16px;border-radius:6px;box-shadow:0 6px 22px rgba(7,26,61,.18)}
.cert{width:1123px;height:794px;transform-origin:0 0;position:relative;box-sizing:border-box;overflow:hidden;color:var(--night);font-family:Georgia,"Times New Roman",serif;
  background:radial-gradient(ellipse at center,#FFFFFF 0%,#FFFCF2 55%,#F6EED6 100%)}
.cert-bg{position:absolute;inset:0;width:100%;height:100%}
.cert-mark{position:absolute;left:50%;top:50%;width:430px;height:430px;margin:-215px 0 0 -215px;opacity:.045}
.cert-mark img{width:100%;height:100%;display:block}
.cert-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 120px 0}
.cert-in .c-logo img{display:block;filter:drop-shadow(0 3px 6px rgba(7,26,61,.25))}
.cert-in .c-kicker{font-family:Arial,Helvetica,sans-serif;letter-spacing:.42em;font-size:13px;color:var(--royal);font-weight:700;margin-top:10px}
.cert-in .c-title{font-size:60px;line-height:1;margin:10px 0 0;letter-spacing:.14em;color:var(--night);font-weight:700}
.cert-in .c-sub{display:flex;align-items:center;gap:16px;font-family:Arial,Helvetica,sans-serif;font-size:15px;letter-spacing:.38em;color:#A8841F;font-weight:700;margin-top:10px}
.cert-in .c-sub i{display:block;width:90px;height:2px;background:linear-gradient(90deg,transparent,#C9A43A)}
.cert-in .c-sub i:last-child{background:linear-gradient(90deg,#C9A43A,transparent)}
.cert-in .c-level{margin-top:12px;padding:6px 46px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:800;letter-spacing:.32em;color:var(--night);
  background:linear-gradient(180deg,#F7E3A1,#D4AF37 60%,#B8912A);clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.cert-in .c-to{font-size:19px;font-style:italic;color:#5a6684;margin-top:16px}
.cert-in .c-name{font-size:52px;font-style:italic;font-weight:700;margin:4px 0 0;color:var(--royal);padding:0 40px 6px;border-bottom:2px solid #C9A43A;max-width:860px;line-height:1.15}
.cert-in .c-parish{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--night);margin-top:12px}
.cert-in .c-text{font-size:18px;line-height:1.5;max-width:760px;margin:10px auto 0;color:#25324f}
.cert-foot{position:absolute;left:120px;right:120px;bottom:60px;display:flex;align-items:flex-end;justify-content:space-between;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#5a6684}
.cert-foot .c-sign{text-align:center;width:250px}
.cert-foot .c-sign .c-date{font-size:14px;color:var(--night)}
.cert-foot .c-sign b{display:block;color:var(--night);font-size:15px;border-top:1.5px solid var(--night);padding-top:7px;margin-top:46px}
.cert-foot .c-sign small{display:block;margin-top:2px;letter-spacing:.08em}
.cert-foot .c-seal{width:236px;height:177px;margin-bottom:-16px}
.cert-foot .c-seal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(120,90,10,.35))}
.cert-foot .c-qr{text-align:center;width:250px;white-space:nowrap}
.cert-foot .c-qr .qr-box{display:inline-block;background:#fff;padding:7px;border:1.5px solid #C9A43A;border-radius:6px}
.cert-foot .c-qr svg{width:120px;height:120px;display:block}
.cert-foot .c-num{display:block;font-weight:700;color:var(--night);letter-spacing:.05em;margin-top:6px}
.cert-foot .c-scan{display:block;font-size:11px}
#cert-print{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff!important;margin:0;padding:0}
  body > *:not(#cert-print){display:none!important}
  #cert-print{display:block}
  #cert-print .cert{transform:none!important;width:297mm;height:210mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* Choix de la langue */
.lang-switch{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lang-switch button{font:inherit;font-size:.82rem;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--text)}
.lang-switch button[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--gold-light)}
.fs-lang{margin-bottom:14px}
.fs-lang button{background:rgba(255,255,255,.08);border-color:rgba(212,175,55,.45);color:#fff}
.fs-lang button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--night)}
.lang-first h2 small{display:block;font-size:.8rem;font-weight:500;opacity:.8;margin-top:4px;letter-spacing:0;text-transform:none}
.lang-first .btn{font-size:1.05rem}
.lang-card .lang-switch{justify-content:flex-start;margin-top:8px}
</style>
</head>

function t(fr, vars) {
  let s = fr;
  if (LANG !== "fr") { const tr = STR_PT_EN[fr]; if (tr) s = tr[LANG === "pt" ? 0 : 1]; }
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  return s;
}

/* Contenu de la formation dans la langue choisie */
let CHAPTERS, DATES, timelineHTML;
function setLang(l, silent) {
  LANG = LANGS[l] ? l : "fr";
  if (!silent || silent === "save") { try { localStorage.setItem("kcc_lang", LANG); } catch (e) { } }
  document.documentElement.lang = LANG;
  ({ CHAPTERS, DATES, timelineHTML } = CONTENT[LANG]());
  SEARCH_INDEX = null;
  if (silent !== true && silent !== "save") render();
}
function langSwitch(cls) {
  return `<div class="lang-switch ${cls || ""}" role="group" aria-label="Langue / Língua / Language">${Object.keys(LANGS).map(l =>
    `<button type="button" data-action="lang" data-l="${l}" aria-pressed="${l === LANG}">${{ fr: "Français", pt: "Português", en: "English" }[l]}</button>`).join("")}</div>`;
}
/* Libellé d'un favori dans la langue choisie */
function favLabel(f) {
  const c = getChapter(f.chapterId);
  if (!c) return f.label;
  if (f.type === "chapter") return c.title;
  const i = Number(String(f.key).split(":")[2]);
  return (c.keyPoints && c.keyPoints[i]) || f.label;
}

/* Construit automatiquement le lien WhatsApp (iPhone, Android, navigateur). */
function waLink(message) {
  return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);
}

const getChapter = (id) => CHAPTERS.find(c => c.id === Number(id));

/* ======================================================================
   Stockage local (localStorage) avec repli en mémoire
   ====================================================================== */
const Storage = {
  _mem: {},
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return key in this._mem ? this._mem[key] : fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { this._mem[key] = value; }
  },
  remove(key) { try { localStorage.removeItem(key); } catch (e) { delete this._mem[key]; } }
};

/* ======================================================================
   [AUTH] Accès membre — VERSION LOCALE
   ⚠ Ce n'est PAS une sécurité réelle : les données restent sur l'appareil.
   Pour un vrai système : remplacez login()/current()/logout() par des appels
   à votre API (Firebase, Supabase, serveur maison…) en gardant la même interface.
   ====================================================================== */
const AuthService = {
  KEY: "kcc_member_v1",
  current() { const m = Storage.get(this.KEY, null); return m && m.verified ? m : null; },
  /* Vérification locale du code (à remplacer par un appel serveur plus tard) */
  checkCode(code) { const c = (x) => norm(x).replace(/ /g, ""); return c(code) === c(CONFIG.ACCESS_CODE); },
  login({ name, parish }) {
    const member = { name, parish, verified: true, since: new Date().toISOString() };
    Storage.set(this.KEY, member);
    return member;
  },
  logout() { Storage.remove(this.KEY); }
};

/* Paroisse de la personne connectée, telle qu'elle l'a saisie (« Pika Pende » → « Paroisse de Pika Pende »). */
function parishLabel(u = AuthService.current()) {
  const p = ((u && u.parish) || "").trim();
  if (!p) return "";
  return /^(paroisse|par[oó]quia|parish)\b/i.test(p) ? p : t("Paroisse de {p}", { p });
}

/* ======================================================================
   Certificat — délivré quand l'évaluation finale est réussie.
   Un nouveau numéro est attribué si le nom, la paroisse ou le meilleur score changent.
   ====================================================================== */
const Certificate = {
  KEY: "kcc_cert_v1",
  current() {
    const u = AuthService.current(), s = Progress.score("final");
    if (!u || !Progress.isCompleted(15) || !s) return null;
    const want = { name: u.name.trim(), parish: (u.parish || "").trim(), score: s.best };
    let c = Storage.get(this.KEY, null);
    if (!c || c.name !== want.name || c.parish !== want.parish || c.score !== want.score) {
      const d = new Date(), pad = (n) => String(n).padStart(2, "0");
      const ymd = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
      c = Object.assign(want, { id: "KCC-" + ymd + "-" + randomCode(4), date: d.toISOString().slice(0, 10) });
      Storage.set(this.KEY, c);
    }
    return c;
  },
  /* Contenu du code QR : les informations du certificat, lisibles par n'importe quel lecteur de QR. */
  qrContent(c) {
    return [
      CONFIG.APP_NAME + " — " + t("Certificat de formation"),
      "N° : " + c.id,
      t("Nom") + " : " + c.name,
      t("Paroisse") + " : " + parishLabel(c),
      t("Niveau") + " : " + t(CONFIG.CERT_LEVEL),
      t("Résultat") + " : " + c.score + " %",
      "Date : " + formatDate(c.date),
      t("Délivré par") + " : " + t(CONFIG.CREATOR)
    ].join("\n");
  },
  qrSVG(c) {
    const q = qrcode(0, "L"); q.addData(this.qrContent(c)); q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }
};
function randomCode(n) {
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = new Uint8Array(n);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.random() * 256);
  return Array.from(b, x => abc[x % abc.length]).join("");
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(LOCALE(), { day: "numeric", month: "long", year: "numeric" });
}

/* ======================================================================
   Progression
   ====================================================================== */
const Progress = {
  KEY: "kcc_progress_v1",
  data: null,
  load() {
    this.data = Object.assign(
      { read: {}, completed: {}, scores: {}, testsTaken: 0, lastChapter: null, lastActivity: null },
      Storage.get(this.KEY, {})
    );
  },
  save() { this.data.lastActivity = new Date().toISOString(); Storage.set(this.KEY, this.data); },
  markRead(id) { this.data.read[id] = true; this.data.lastChapter = id; this.save(); },
  isCompleted(id) { return !!this.data.completed[id]; },
  isUnlocked(id) { return id === 1 || this.isCompleted(id) || this.isCompleted(id - 1); },
  /* Retourne true si le chapitre vient d'être terminé pour la première fois */
  complete(id) { const first = !this.isCompleted(id); this.data.completed[id] = true; this.save(); return first; },
  /* Enregistre un score ; retourne true si nouveau meilleur score */
  recordScore(key, pct) {
    const s = this.data.scores[key] || { best: 0, last: 0, attempts: 0 };
    const newBest = s.attempts > 0 && pct > s.best;
    s.best = Math.max(s.best, pct); s.last = pct; s.attempts += 1;
    this.data.scores[key] = s; this.data.testsTaken += 1; this.save();
    return newBest;
  },
  score(key) { return this.data.scores[key] || null; },
  stats() {
    const done = CHAPTERS.filter(c => this.isCompleted(c.id)).length;
    const sc = Object.values(this.data.scores);
    return {
      done, total: CHAPTERS.length, pct: Math.round(done / CHAPTERS.length * 100),
      best: sc.length ? Math.max(...sc.map(s => s.best)) : 0,
      avg: sc.length ? Math.round(sc.reduce((a, s) => a + s.best, 0) / sc.length) : 0,   // moyenne des meilleurs scores par test
      tests: this.data.testsTaken, last: this.data.lastActivity, allDone: done === CHAPTERS.length
    };
  },
  nextTarget() {
    const last = this.data.lastChapter;
    if (last && !this.isCompleted(last)) return getChapter(last);
    return CHAPTERS.find(c => !this.isCompleted(c.id) && this.isUnlocked(c.id)) || null;
  },
  reset() { Storage.remove(this.KEY); this.load(); }
};

   ====================================================================== */
const Favs = {
  KEY: "kcc_favs_v1",
  list: [],
  load() { this.list = Storage.get(this.KEY, []); },
  has(key) { return this.list.some(f => f.key === key); },
  toggle(item) {
    if (this.has(item.key)) { this.list = this.list.filter(f => f.key !== item.key); Storage.set(this.KEY, this.list); return false; }
    this.list.push(item); Storage.set(this.KEY, this.list); return true;
  }
};

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’'`]/g, " ").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const stripTags = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; };
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmtDate(iso) { if (!iso) return "—"; try { return new Date(iso).toLocaleString(LOCALE(), { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } }
function toast(msg) {
  const z = document.getElementById("toasts"); const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg; z.appendChild(el);
  while (z.children.length > 2) z.firstChild.remove();   // jamais plus de 2 messages à la fois
  setTimeout(() => el.remove(), 2600);
}
/* Fenêtre de confirmation intégrée (remplace confirm(), souvent bloqué dans les APK/WebView) */
function askConfirm(message, okLabel) {
  return new Promise(resolve => {
    const o = document.createElement("div"); o.className = "modal-bg";
    o.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true"><p>${esc(message)}</p>
      <div class="btn-row inline"><button class="btn btn-ghost" data-r="0">${t("Annuler")}</button><button class="btn btn-royal" data-r="1">${esc(okLabel || t("Confirmer"))}</button></div></div>`;
    o.addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (b || e.target === o) { o.remove(); resolve(!!(b && b.dataset.r === "1")); } });
    document.body.appendChild(o); o.querySelector('[data-r="1"]').focus();
  });
}

/* ---------- Moteur de QCM ---------- */
const Quiz = {
  state: null,
  start(key) {
    let qs;
    if (key === "final") {
      const pool = CHAPTERS.flatMap(c => c.questions.map(q => Object.assign({}, q, { ch: c.id })));
      qs = shuffle(pool).slice(0, CONFIG.FINAL_EXAM_SIZE);
    } else {
      const c = getChapter(key); qs = c.questions.map(q => Object.assign({}, q, { ch: c.id }));
    }
    this.state = { key, qs: qs.map(q => this.prepare(q)), i: 0, score: 0, answered: false };
  },
  prepare(q) {
    if (q.type === "mcq") q._opts = shuffle(q.options.map((t, i) => ({ t, ok: i === q.answer })));
    if (q.type === "match") q._rights = shuffle(q.pairs.map(p => p[1]));
    return q;
  },
  box() { return document.getElementById("quiz-box"); },
  current() { return this.state.qs[this.state.i]; },
  typeLabel(k) { return t({ mcq: "QCM", tf: "Vrai / Faux", short: "Question courte", match: "Association" }[k]); },
  renderQuestion() {
    const s = this.state, q = this.current(), n = s.qs.length;
    let body = "";
    if (q.type === "mcq") body = `<div class="opts">${q._opts.map((o, i) => `<button class="opt" data-action="qa" data-i="${i}"><span class="l">${"ABCDEF"[i]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
    if (q.type === "tf") body = `<div class="opts tf"><button class="opt" data-action="qa" data-v="true">${t("Vrai")}</button><button class="opt" data-action="qa" data-v="false">${t("Faux")}</button></div>`;
    if (q.type === "short") body = `<label class="sr-only" for="q-short">${t("Votre réponse")}</label><input id="q-short" class="input" autocomplete="off" placeholder="${t("Votre réponse")}…"><div class="btn-row"><button class="btn btn-royal btn-block" data-action="q-short">${t("Valider")}</button></div>`;
    if (q.type === "match") body = q.pairs.map((p, i) => `<div class="match-row" id="mr${i}"><b>${esc(p[0])}</b>
        <select class="input" id="ms${i}" aria-label="${t("Associer")} ${esc(p[0])}"><option value="">— ${t("Choisir")} —</option>${q._rights.map(r => `<option>${esc(r)}</option>`).join("")}</select></div>`).join("")
        + `<div class="btn-row"><button class="btn btn-royal btn-block" data-action="q-match">${t("Valider")}</button></div>`;
    this.box().innerHTML = `
      <div class="q-top"><span>${t("Question")} ${s.i + 1} / ${n}</span><span>${this.typeLabel(q.type)}</span></div>
      ${bar(Math.round(s.i / n * 100), "sm")}
      ${s.key === "final" ? `<span class="q-tag">${t("Chapitre")} ${q.ch}</span>` : ""}
      <h2 class="q-text">${esc(q.q)}</h2>${body}<div id="q-feedback"></div>`;
    s.answered = false;
  },
  answer(ok, correctText) {
    const s = this.state, q = this.current(); s.answered = true; if (ok) s.score++;
    this.box().querySelectorAll(".opt, input, select, [data-action='q-short'], [data-action='q-match']").forEach(el => el.disabled = true);
    const last = s.i === s.qs.length - 1;
    const fb = document.getElementById("q-feedback");
    fb.innerHTML = `<div class="feedback ${ok ? "ok" : "ko"}">
      <div class="fb-title">${ok ? "✅ " + t("Bonne réponse") : "❌ " + t("Mauvaise réponse")}</div>
      ${ok ? "" : `<div class="fb-ans"><strong>${t("Bonne réponse")} :</strong> ${correctText}</div>`}
      <p>${esc(q.explain || "")}</p>
      <button class="btn btn-gold btn-block" data-action="q-next">${last ? t("Voir le résultat") : t("Question suivante") + " →"}</button></div>`;
    const btn = fb.querySelector("button"); btn.focus({ preventScroll: true });
    fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
  },
  next() {
    const s = this.state;
    if (s.i < s.qs.length - 1) { s.i++; this.renderQuestion(); this.box().scrollIntoView({ behavior: "smooth", block: "start" }); }
    else this.finish();
  },
  finish() {
    const s = this.state, n = s.qs.length, pct = Math.round(s.score / n * 100);
    const newBest = Progress.recordScore(s.key, pct);
    const passed = pct >= CONFIG.PASS_SCORE;
    const chId = s.key === "final" ? 15 : Number(s.key);
    let firstDone = false;
    if (passed) firstDone = Progress.complete(chId);
    if (firstDone) toast("✓ " + t("Chapitre terminé"));
    if (newBest) setTimeout(() => toast("🏆 " + t("Nouveau meilleur score")), firstDone ? 700 : 0);
    const msg = pct >= 90 ? t("Excellent travail !") : pct >= 70 ? t("Très bonne progression.") : pct >= CONFIG.PASS_SCORE ? t("Bonne progression, continuez ainsi.") : t("Relisez le chapitre puis réessayez (réussite à partir de {p} %).", { p: CONFIG.PASS_SCORE });
    const next = getChapter(chId + 1), best = Progress.score(s.key).best, all = Progress.stats().allDone;
    this.box().innerHTML = `<div class="result fade">
      <div class="eyebrow">${t("RÉSULTAT")}</div>
      <div class="score">${s.score} / ${n}</div>
      <div class="pct">${pct} %${passed ? " · " + t("réussi") : ""}</div>
      <p class="msg">${msg}</p>
      <p class="muted small">${t("Meilleur score")} : ${best} %</p>
      <div class="btn-row">
        <button class="btn btn-ghost btn-block" data-action="q-retry">${t("REFAIRE LE TEST")}</button>
        ${passed && s.key === "final" ? `<a class="btn btn-gold btn-block" href="#/certificate">🎓 ${t("Voir mon certificat")}</a>` : ""}
        ${all && s.key === "final" ? `<a class="btn btn-ghost btn-block" href="#/finished">${t("Voir mon bilan de formation")}</a>` : ""}
        ${next && Progress.isUnlocked(next.id) && s.key !== "final" ? `<a class="btn btn-gold btn-block" href="#/chapter/${next.id}">${t("CHAPITRE SUIVANT")} →</a>` : ""}
        <a class="btn btn-ghost btn-block" href="#/chapter/${chId}">${t("Revoir le chapitre")}</a>
      </div></div>`;
  }
};

/* ---------- Recherche ---------- */
let SEARCH_INDEX = null;
function buildIndex() {
  const idx = [];
  CHAPTERS.forEach(c => {
    const segs = [c.title, c.summary, ...c.keyPoints, ...c.terms.map(t => t.term + " : " + t.def)];
    const d = document.createElement("div"); d.innerHTML = c.lesson + c.understand;
    d.querySelectorAll("p, li, h3").forEach(el => { const t = el.textContent.trim(); if (t && t !== PENDING) segs.push(t); });
    segs.forEach(s => { if (s && !s.includes(PENDING)) idx.push({ chapter: c, text: s, n: norm(s + " " + c.title) }); });
  });
  DATES.forEach(d => idx.push({ chapter: getChapter(14), text: d.date + " — " + d.title, n: norm(t("Dates historiques") + " " + d.date + " " + d.title), isDate: true }));
  return idx;
}
const ACC = { a: "[aàâä]", e: "[eéèêë]", i: "[iîï]", o: "[oôö]", u: "[uùûü]", c: "[cç]" };
function highlight(text, words) {
  let out = esc(text);
  words.forEach(w => {
    if (w.length < 2) return;
    const re = new RegExp("(" + w.split("").map(ch => ACC[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("") + ")", "gi");
    out = out.replace(re, "<mark>$1</mark>");
  });
  return out;
}
function searchResults(query) {
  const q = norm(query);
  if (q.length < 2) return `<p class="muted small">${t("Exemples : commandements, profession de foi, KCC, purification, onction, dates…")}</p>`;
  SEARCH_INDEX = SEARCH_INDEX || buildIndex();
  const words = q.split(" ");
  const hits = SEARCH_INDEX.filter(e => words.every(w => e.n.includes(w)));
  if (!hits.length) return `<div class="empty"><div class="e-ic">🔎</div><p>${t("Aucun résultat pour « {q} ».", { q: esc(query) })}</p></div>`;
  const seen = new Set(), rows = [];
  hits.forEach(h => { const k = h.chapter.id + "|" + h.text; if (!seen.has(k)) { seen.add(k); rows.push(h); } });
  return `<p class="muted small">${rows.length} ${t("résultat(s)")}</p>` + rows.slice(0, 40).map(h => {
    const href = h.isDate ? "#/dates" : "#/chapter/" + h.chapter.id;
    const act = h.isDate ? "" : ` data-action="open-chapter" data-id="${h.chapter.id}"`;
    return `<a class="res" href="${href}"${act}><b>${h.isDate ? "📜 " + t("Dates historiques") : t("Chapitre") + " " + h.chapter.id + " · " + esc(h.chapter.title)}</b><p>${highlight(h.text, words)}</p></a>`;
  }).join("");
}

/* Cadre, coins dorés et sceau du certificat (dessinés en SVG, sans croix ni verset). */
function certFrameSVG() {
  const corner = `<g fill="none" stroke="#C9A43A" stroke-linecap="round">
      <path d="M8 120 V40 Q8 8 40 8 H120" stroke-width="3"/>
      <path d="M22 96 V48 Q22 22 48 22 H96" stroke-width="1.5"/>
      <path d="M40 8 Q40 40 8 40" stroke-width="1.5"/>
      <circle cx="34" cy="34" r="5" fill="#C9A43A" stroke="none"/>
      <path d="M58 22 q10 -12 22 0 q-12 10 -22 0z M22 58 q-12 10 0 22 q10 -12 0 -22z" fill="#E7CF86" stroke-width="1"/>
    </g>`;
  const at = (x, y, sx, sy) => `<g transform="translate(${x} ${y}) scale(${sx} ${sy})">${corner}</g>`;
  return `<svg class="cert-bg" viewBox="0 0 1123 794" preserveAspectRatio="none" aria-hidden="true">
    <defs><pattern id="cguil" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="12" fill="none" stroke="#C9A43A" stroke-opacity=".10" stroke-width="1"/></pattern></defs>
    <rect x="0" y="0" width="1123" height="794" fill="url(#cguil)"/>
    <rect x="14" y="14" width="1095" height="766" fill="none" stroke="#071A3D" stroke-width="14"/>
    <rect x="30" y="30" width="1063" height="734" fill="none" stroke="#C9A43A" stroke-width="2.5"/>
    <rect x="37" y="37" width="1049" height="720" fill="none" stroke="#C9A43A" stroke-width="1" stroke-dasharray="2 5"/>
    ${at(30, 30, 1, 1)}${at(1093, 30, -1, 1)}${at(30, 764, 1, -1)}${at(1093, 764, -1, -1)}
  </svg>`;
}
function certSealSVG(score) {
  const pts = [], leaves = [];
  for (let i = 0; i < 48; i++) {
    const r = i % 2 ? 66 : 73, a = Math.PI * 2 * i / 48;
    pts.push((120 + r * Math.cos(a)).toFixed(1) + "," + (88 + r * Math.sin(a)).toFixed(1));
  }
  /* Deux branches de laurier autour du sceau */
  for (let k = 0; k < 9; k++) {
    const deg = 118 + k * 15, a = deg * Math.PI / 180, x = 120 + 94 * Math.cos(a), y = 88 + 82 * Math.sin(a), rot = deg + 90 + 28;
    [[x, y, rot], [240 - x, y, 180 - rot]].forEach(([lx, ly, lr]) =>
      leaves.push(`<ellipse cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" rx="11" ry="4.6" transform="rotate(${lr.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})"/>`));
  }
  return `<svg viewBox="0 0 240 180" aria-label="Sceau ${score} %">
    <defs><radialGradient id="cseal" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#F7E3A1"/><stop offset=".55" stop-color="#D4AF37"/><stop offset="1" stop-color="#A8841F"/></radialGradient></defs>
    <g fill="#C9A43A" opacity=".9">${leaves.join("")}</g>
    <polygon points="${pts.join(" ")}" fill="url(#cseal)"/>
    <circle cx="120" cy="88" r="57" fill="#071A3D"/>
    <circle cx="120" cy="88" r="52" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="120" y="66" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#F5D76E">KCCiste</text>
    <text x="120" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="27" font-weight="700" fill="#FFFFFF">${score} %</text>
    <text x="120" y="113" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#F5D76E">${t("RÉUSSI")}</text>
    <text x="120" y="127" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#D4AF37">${esc(t(CONFIG.CERT_LEVEL).toUpperCase())}</text>
  </svg>`;
}

/* Image JPEG du certificat (2246 × 1588 px), pour l'enregistrer ou la partager.
   Le certificat est copié dans un SVG <foreignObject> avec ses styles, puis dessiné sur un canvas. */
function certificateImage() {
  return new Promise((resolve, reject) => {
    const src = document.getElementById("cert"); if (!src) return reject(new Error("no-cert"));
    const css = [...document.styleSheets].flatMap(sh => { try { return [...sh.cssRules]; } catch (e) { return []; } })
      .map(r => r.cssText).filter(t => /^(:root|\.cert)/.test(t)).join("\n");
    const copy = src.cloneNode(true); copy.removeAttribute("id"); copy.style.transform = "none";
    const xhtml = new XMLSerializer().serializeToString(copy);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794"><foreignObject x="0" y="0" width="1123" height="794">` +
      `<div xmlns="http://www.w3.org/1999/xhtml" style="margin:0"><style>${css.replace(/</g, "\\3C ")}</style>${xhtml}</div></foreignObject></svg>`;
    const img = new Image();
    img.onload = () => {
      try {
        const k = 2, cv = document.createElement("canvas"); cv.width = 1123 * k; cv.height = 794 * k;
        const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.scale(k, k); g.drawImage(img, 0, 0);
        resolve(cv.toDataURL("image/jpeg", 0.92));
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error("svg-load"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}
function certFileName() { const c = Certificate.current(); return "Certificat-KCCiste-" + (c ? c.id : "") + ".jpg"; }
/* target : "whatsapp", "facebook", "" (choix libre) ou "save" (enregistrer dans le téléphone) */
async function shareCertificate(target) {
  toast("⏳ " + t("Préparation de l'image…"));
  let data;
  try { data = await certificateImage(); }
  catch (e) { toast(t("Impossible de créer l'image. Utilisez « Enregistrer en PDF ».")); return; }
  const b64 = data.split(",")[1], name = certFileName();
  if (window.KCCAndroid && KCCAndroid.saveImage) {
    if (target === "save") KCCAndroid.saveImage(b64, name, "✓ " + t("Certificat enregistré dans la galerie (Images › KCCiste)"), t("Impossible d'enregistrer l'image dans le téléphone."));
    else KCCAndroid.shareImage(b64, name, target, t("Mon certificat") + " " + CONFIG.APP_NAME, t("Application introuvable : choisissez une autre application."));
    return;
  }
  /* Hors de l'application Android (navigateur) : partage du système ou téléchargement. */
  try {
    const blob = await (await fetch(data)).blob(), file = new File([blob], name, { type: "image/jpeg" });
    if (target !== "save" && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { /* on télécharge l'image */ }
  const a = document.createElement("a"); a.href = data; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* Réduit le certificat (format A4) à la largeur de l'écran. */
function fitCertificate() {
  const w = document.getElementById("cert-wrap"), c = document.getElementById("cert");
  if (!w || !c) return;
  const k = w.clientWidth / 1123;
  c.style.transform = "scale(" + k + ")"; w.style.height = Math.ceil(794 * k) + "px";
}
window.addEventListener("resize", fitCertificate);

const VIEWS = {
  home: viewHome, courses: viewCourses, chapter: viewChapter, quiz: viewQuiz, tests: viewTests,
  progress: viewProgress, dates: viewDates, practices: viewPractices, revision: viewRevision,
  favorites: viewFavorites, search: viewSearch, about: viewAbout, contact: viewContact,
  menu: viewMenu, finished: viewFinished, certificate: viewCertificate
};

function render() {
  const app = document.getElementById("app");
  const { name, param } = parseRoute();
  const user = AuthService.current();

  if (!user) {
    if (!langChosen()) { app.innerHTML = viewLangChoice(); document.title = CONFIG.APP_NAME; window.scrollTo(0, 0); return; }
    if (name === "member") app.innerHTML = viewMember();
    else if (name === "access") app.innerHTML = viewAccess();
    else return replaceRoute("access");
    document.title = CONFIG.APP_NAME; window.scrollTo(0, 0); return;
  }
  if (name === "welcome") { app.innerHTML = viewWelcome(); window.scrollTo(0, 0); return; }
  if (!VIEWS[name]) return replaceRoute("home");

  const content = VIEWS[name](param);
  let title = TITLES[name] ? t(TITLES[name]) : "";
  if (name === "chapter" && getChapter(param)) title = t("Chapitre") + " " + param;
  if (name === "quiz") title = param === "final" ? t("Évaluation finale") : t("Test") + " · " + t("Chapitre") + " " + param;
  app.innerHTML = shell(name, title, content);
  if (name === "certificate") fitCertificate();
  document.title = (title ? title + " · " : "") + CONFIG.APP_NAME;
  window.scrollTo(0, 0);
}

/* ======================================================================
   Actions (délégation d'événements)
   ====================================================================== */
const Actions = {
  "share-cert"(el) { shareCertificate(el.dataset.target || ""); },
  /* Ouvre la fenêtre d'impression d'Android (« Enregistrer au format PDF »). */
  "print-cert"() {
    /* Copie du certificat placée directement dans <body> : seule elle est imprimée. */
    const src = document.getElementById("cert"); if (!src) return;
    let box = document.getElementById("cert-print");
    if (!box) { box = document.createElement("div"); box.id = "cert-print"; document.body.appendChild(box); }
    const copy = src.cloneNode(true); copy.removeAttribute("id"); copy.style.transform = "none";
    copy.querySelectorAll("[id]").forEach(g => {   // identifiants uniques dans la copie (dégradés, motifs, texte du sceau)
      const old = g.id; g.id = old + "p";
      copy.querySelectorAll(`[fill="url(#${old})"]`).forEach(el => el.setAttribute("fill", `url(#${g.id})`));
      copy.querySelectorAll(`[href="#${old}"]`).forEach(el => el.setAttribute("href", `#${g.id}`));
    });
    box.replaceChildren(copy);
    if (window.KCCAndroid && KCCAndroid.printCertificate) KCCAndroid.printCertificate(t("Certificat") + " " + (Certificate.current() || {}).id);
    else window.print();
  },
  back() { if (history.length > 1) history.back(); else go("home"); },
  continue(el) { toast("📚 " + t("Formation continuée")); go(el.getAttribute("href").replace("#/", "")); },
  lang(el) { setLang(el.dataset.l); },
  "lang-first"(el) { setLang(el.dataset.l, "save"); replaceRoute("access"); },
  "open-chapter"(el) {
    const id = Number(el.dataset.id);
    if (Progress.isUnlocked(id)) go("chapter/" + id);
    else toast("🔒 " + t("Terminez d'abord le chapitre {n}", { n: id - 1 }));
  },
  locked(el) { toast("🔒 " + t("Terminez d'abord le chapitre {n}", { n: Number(el.dataset.id) - 1 })); },
  "complete-chapter"(el) {
    const id = Number(el.dataset.id);
    if (Progress.complete(id)) toast("✓ " + t("Chapitre terminé"));
    render();
  },
  "fav-chapter"(el) {
    const c = getChapter(el.dataset.id);
    const on = Favs.toggle({ key: "c:" + c.id, type: "chapter", chapterId: c.id, label: c.title });
    el.setAttribute("aria-pressed", on); el.textContent = on ? "★" : "☆";
    toast(on ? "⭐ " + t("Ajouté aux favoris") : t("Retiré des favoris"));
  },
  "fav-note"(el) {
    const c = getChapter(el.dataset.id), i = Number(el.dataset.i);
    const on = Favs.toggle({ key: `n:${c.id}:${i}`, type: "note", chapterId: c.id, label: c.keyPoints[i] });
    el.setAttribute("aria-pressed", on); el.textContent = on ? "★" : "☆";
    toast(on ? "⭐ " + t("Notion ajoutée aux favoris") : t("Retiré des favoris"));
  },
  qa(el) {
    if (Quiz.state.answered) return;
    const q = Quiz.current();
    const buttons = [...Quiz.box().querySelectorAll(".opt")];
    if (q.type === "mcq") {
      const i = Number(el.dataset.i), ok = q._opts[i].ok;
      buttons.forEach((b, j) => { if (q._opts[j].ok) b.classList.add("correct"); });
      if (!ok) el.classList.add("wrong");
      Quiz.answer(ok, esc(q._opts.find(o => o.ok).t));
    } else {
      const v = el.dataset.v === "true", ok = v === q.answer;
      buttons.forEach(b => { if ((b.dataset.v === "true") === q.answer) b.classList.add("correct"); });
      if (!ok) el.classList.add("wrong");
      Quiz.answer(ok, q.answer ? t("Vrai") : t("Faux"));
    }
  },
  "q-short"() {
    if (Quiz.state.answered) return;
    const q = Quiz.current(), input = document.getElementById("q-short");
    const val = norm(input.value);
    if (!val) { toast(t("Veuillez saisir une réponse")); input.focus(); return; }
    const ok = q.accept.some(a => norm(a) === val);
    input.style.borderColor = ok ? "var(--ok)" : "var(--err)";
    Quiz.answer(ok, esc(q.display));
  },
  "q-match"() {
    if (Quiz.state.answered) return;
    const q = Quiz.current();
    const vals = q.pairs.map((p, i) => document.getElementById("ms" + i).value);
    if (vals.some(v => !v)) { toast(t("Associez chaque élément avant de valider")); return; }
    let ok = true;
    q.pairs.forEach((p, i) => { const good = vals[i] === p[1]; if (!good) ok = false; document.getElementById("mr" + i).classList.add(good ? "ok" : "ko"); });
    Quiz.answer(ok, "<br>" + q.pairs.map(p => `${esc(p[0])} → ${esc(p[1])}`).join("<br>"));
  },
  "q-next"() { Quiz.next(); },
  "q-retry"() { render(); },
  "reset-progress"() {
    askConfirm(t("Voulez-vous vraiment effacer toute votre progression ? Cette action est définitive."), t("Effacer")).then(ok => { if (ok) { Progress.reset(); toast(t("Progression réinitialisée")); render(); } });
  },
  logout() {
    askConfirm(t("Changer de profil ? Votre progression reste enregistrée sur cet appareil."), t("Changer")).then(ok => { if (ok) { AuthService.logout(); replaceRoute("access"); } });
  }
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || !Actions[el.dataset.action]) return;
  e.preventDefault();
  Actions[el.dataset.action](el, e);
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "member-form") return;
  e.preventDefault();
  const f = new FormData(e.target);
  const name = String(f.get("name") || "").trim(), parish = String(f.get("parish") || "").trim();
  const err = [];
  if (name.length < 3) err.push(t("Veuillez indiquer votre nom complet (au moins 3 caractères)."));
  if (!parish) err.push(t("Veuillez indiquer votre paroisse."));
  const code = String(f.get("code") || "");
  if (!code.trim()) err.push(t("Veuillez saisir le code d'accès."));
  else if (!AuthService.checkCode(code)) err.push(t("Code d'accès incorrect. Vérifiez l'orthographe ou contactez le Prédicateur sur WhatsApp."));
  const box = document.getElementById("form-error");
  if (err.length) {
    box.innerHTML = `<div class="form-error">${err.map(esc).join("<br>")}<br><a href="${waLink(t(CONFIG.MSG_ACCESS))}" target="_blank" rel="noopener" style="color:inherit;font-weight:700">💬 ${t("Demander le code sur WhatsApp")}</a></div>`;
    return;
  }
  AuthService.login({ name, parish });
  go("welcome");
});

document.addEventListener("input", (e) => {
  if (e.target.id === "search-input") document.getElementById("search-results").innerHTML = searchResults(e.target.value);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "q-short") { e.preventDefault(); Actions["q-short"](); }
});

window.addEventListener("hashchange", render);

/* ======================================================================
   Démarrage
   ====================================================================== */
(function init() {
  setLang(LANG, true);
  Progress.load(); Favs.load();
  document.getElementById("favicon").href = APP_LOGO;
  render();
})();
</script>
</body>
</html>
