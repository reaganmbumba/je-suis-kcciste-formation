plugins { id 'com.android.application' }

android {
    namespace 'cd.jesuiskcciste.formation'
    compileSdk 34

    defaultConfig {
        applicationId "cd.jesuiskcciste.formation"
        minSdk 21            // Android 5.0 et plus
        targetSdk 34
        versionCode 3        // augmentez à chaque nouvelle version (2, 3, ...)
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
